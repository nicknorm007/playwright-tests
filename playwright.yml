name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run (Mondays 13:00 UTC) — the tests target a live third-party
  # site, so this surfaces breakage if that site changes its pages/forms.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        # list = readable log in the Actions console; html = the report
        # uploaded as an artifact in the next step (the repo's config does
        # not set a reporter, so both are named explicitly here).
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
